<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flora — your local companion</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">Flora</p>
        <p class="brand-tag">your local companion</p>
      </div>
    </div>
    <div class="status-pill" id="statusPill" data-state="checking">Checking Ollama…</div>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Flora">
      <div class="flora-stage" id="floraStage" data-mood="idle">
        <svg class="flora-face" viewBox="0 0 240 260" role="img" aria-label="Flora's face">
          <defs>
            <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#f4a89a" stop-opacity="0.55" />
              <stop offset="100%" stop-color="#f4a89a" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7cb87a" />
              <stop offset="100%" stop-color="#3f7d4e" />
            </linearGradient>
            <linearGradient id="skinGrad" x1="30%" y1="10%" x2="70%" y2="100%">
              <stop offset="0%" stop-color="#ffe8d6" />
              <stop offset="100%" stop-color="#f0c9a8" />
            </linearGradient>
          </defs>

          <!-- leafy hair / crown -->
          <g class="leaves">
            <ellipse cx="78" cy="58" rx="28" ry="42" fill="url(#leafGrad)" transform="rotate(-28 78 58)" />
            <ellipse cx="120" cy="42" rx="30" ry="46" fill="url(#leafGrad)" />
            <ellipse cx="162" cy="58" rx="28" ry="42" fill="url(#leafGrad)" transform="rotate(28 162 58)" />
            <ellipse cx="96" cy="70" rx="18" ry="28" fill="#5fa86a" transform="rotate(-12 96 70)" />
            <ellipse cx="148" cy="70" rx="18" ry="28" fill="#5fa86a" transform="rotate(12 148 70)" />
          </g>

          <!-- face -->
          <ellipse class="head" cx="120" cy="145" rx="72" ry="78" fill="url(#skinGrad)" />
          <circle cx="88" cy="155" r="16" fill="url(#cheek)" />
          <circle cx="152" cy="155" r="16" fill="url(#cheek)" />

          <!-- eyes -->
          <g class="eyes">
            <g class="eye left">
              <ellipse cx="95" cy="138" rx="10" ry="12" fill="#2c3b2e" />
              <circle class="shine" cx="98" cy="133" r="3.2" fill="#fff8ef" />
            </g>
            <g class="eye right">
              <ellipse cx="145" cy="138" rx="10" ry="12" fill="#2c3b2e" />
              <circle class="shine" cx="148" cy="133" r="3.2" fill="#fff8ef" />
            </g>
            <g class="lids" opacity="0">
              <path d="M84 138 Q95 128 106 138" fill="none" stroke="#f0c9a8" stroke-width="8" stroke-linecap="round" />
              <path d="M134 138 Q145 128 156 138" fill="none" stroke="#f0c9a8" stroke-width="8" stroke-linecap="round" />
            </g>
          </g>

          <!-- brows -->
          <path class="brow left" d="M82 118 Q95 112 108 118" fill="none" stroke="#5a6b55" stroke-width="3" stroke-linecap="round" />
          <path class="brow right" d="M132 118 Q145 112 158 118" fill="none" stroke="#5a6b55" stroke-width="3" stroke-linecap="round" />

          <!-- mouth -->
          <path class="mouth" d="M104 178 Q120 190 136 178" fill="none" stroke="#c56b5c" stroke-width="4" stroke-linecap="round" />

          <!-- soft freckles -->
          <g fill="#d89b78" opacity="0.45">
            <circle cx="78" cy="160" r="1.4" />
            <circle cx="86" cy="168" r="1.2" />
            <circle cx="160" cy="162" r="1.3" />
            <circle cx="152" cy="170" r="1.1" />
          </g>
        </svg>
        <p class="flora-caption" id="floraCaption">Flora is listening</p>
      </div>

      <div class="voice-row">
        <button type="button" class="ghost-btn" id="speakToggle" aria-pressed="true" title="Hear Flora speak">
          Voice reply on
        </button>
        <button type="button" class="ghost-btn" id="clearChatBtn" title="Clear chat history">
          Clear chat
        </button>
      </div>
    </section>

    <section class="chat-panel" aria-label="Conversation">
      <div class="messages" id="messages" role="log" aria-live="polite"></div>

      <form class="composer" id="composer">
        <button type="button" class="mic-btn" id="micBtn" aria-pressed="false" title="Hold or click to talk">
          <span class="mic-icon" aria-hidden="true"></span>
          <span class="sr-only">Talk to Flora</span>
        </button>
        <label class="sr-only" for="messageInput">Message</label>
        <textarea
          id="messageInput"
          rows="1"
          placeholder="Talk to Flora… type or use the mic"
          autocomplete="off"
        ></textarea>
        <button type="submit" class="send-btn" id="sendBtn">Send</button>
      </form>
      <p class="hint" id="voiceHint">Tip: click the mic to speak. Flora can read replies aloud.</p>
    </section>

    <aside class="memory-panel" aria-label="What Flora remembers">
      <div class="memory-head">
        <h2>What Flora remembers</h2>
        <button type="button" class="ghost-btn small" id="clearMemoryBtn">Forget all</button>
      </div>
      <ul class="memory-list" id="memoryList"></ul>
      <p class="memory-empty" id="memoryEmpty">As you share things that matter, Flora will keep them here — only on this device.</p>
    </aside>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
